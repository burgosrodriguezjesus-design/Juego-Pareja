<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b1430">
<title>Nuestra Historia</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/escena.css">
<link rel="stylesheet" href="css/ui.css">
<link rel="stylesheet" href="css/acertijos.css">
</head>
<body>

<!-- ===== FONDO: paisaje dibujado + foto opcional + atmósfera ===== -->
<div id="mundo">
  <canvas id="lienzo" aria-hidden="true"></canvas>
  <div id="foto-fondo" aria-hidden="true"></div>
  <div id="velo" aria-hidden="true"></div>
  <div id="vineta" aria-hidden="true"></div>
</div>
<div id="foco" aria-hidden="true"></div>

<!-- ===== BARRA SUPERIOR ===== -->
<header id="hud" hidden>
  <button id="btn-mapa"  class="hud-btn" type="button" title="El viaje">
    <span class="hud-ico">◈</span><span class="hud-txt">El viaje</span>
  </button>
  <div id="hud-centro">
    <span id="hud-lugar"></span>
    <span id="hud-progreso"></span>
  </div>
  <div class="hud-derecha">
    <button id="btn-album" class="hud-btn" type="button" title="Recuerdos">
      <span class="hud-ico">❤</span><span class="hud-txt">Recuerdos</span>
    </button>
    <button id="btn-musica" class="hud-btn hud-btn-icono" type="button" title="Música" aria-pressed="false">
      <span class="hud-ico" id="ico-musica">♪</span>
    </button>
  </div>
</header>

<!-- ===== CONTENIDO ===== -->
<main id="escenario" tabindex="-1"></main>

<!-- ===== CAPAS FLOTANTES ===== -->
<div id="celebracion" aria-hidden="true"></div>
<div id="transicion" aria-hidden="true"></div>
<div id="avisos" role="status" aria-live="polite"></div>

<audio id="pista-musica" loop preload="none"></audio>

<!-- ===== CÓDIGO ===== -->
<script src="contenido/historia.js"></script>
<script src="js/util.js"></script>
<script src="js/audio.js"></script>
<script src="js/escena.js"></script>
<script src="js/dialogo.js"></script>
<script src="js/acertijos.js"></script>
<script src="js/album.js"></script>
<script src="js/motor.js"></script>
<script src="js/main.js"></script>
</body>
</html>
