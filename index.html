<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b1430">
<title>Nuestra Historia</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/escena.css">
<link rel="stylesheet" href="css/ui.css">
<link rel="stylesheet" href="css/acertijos.css">
<link rel="stylesheet" href="css/mundo.css">
</head>
<body>

<!-- ===== MUNDO 3D ===== -->
<canvas id="lienzo3d" aria-hidden="true"></canvas>

<!-- ===== FONDO 2D: se usa en portada, prólogo y carta, y si no hay 3D ===== -->
<div id="mundo">
  <canvas id="lienzo" aria-hidden="true"></canvas>
  <div id="foto-fondo" aria-hidden="true"></div>
  <div id="velo" aria-hidden="true"></div>
  <div id="vineta" aria-hidden="true"></div>
</div>
<div id="foco" aria-hidden="true"></div>

<!-- ===== BARRA SUPERIOR ===== -->
<header id="hud" hidden>
  <button id="btn-mapa"  class="hud-btn" type="button" title="El viaje">
    <span class="hud-ico">◈</span><span class="hud-txt">El viaje</span>
  </button>
  <div id="hud-centro">
    <span id="hud-lugar"></span>
    <span id="hud-progreso"></span>
  </div>
  <div class="hud-derecha">
    <button id="btn-album" class="hud-btn" type="button" title="Recuerdos">
      <span class="hud-ico">❤</span><span class="hud-txt">Recuerdos</span>
    </button>
    <button id="btn-musica" class="hud-btn hud-btn-icono" type="button" title="Música" aria-pressed="false">
      <span class="hud-ico" id="ico-musica">♪</span>
    </button>
  </div>
</header>

<!-- ===== CONTENIDO ===== -->
<main id="escenario" tabindex="-1"></main>

<!-- ===== INTERFAZ DEL MUNDO 3D ===== -->
<div id="capa-mundo" hidden>
  <div id="brujula">
    <span id="brujula-flecha">▲</span>
    <span id="brujula-texto"></span>
    <span id="brujula-dist"></span>
  </div>

  <div id="mira"></div>

  <div id="cartel-objeto" hidden>
    <span id="cartel-titulo"></span>
    <span id="cartel-accion"></span>
  </div>

  <div id="mandos">
    <div id="palanca"><div id="palanca-bola"></div></div>
  </div>

  <button id="btn-tocar" type="button" hidden>
    <span class="ico">✦</span>
    <span class="txt">Tocar</span>
  </button>

  <div id="aviso-raton" hidden>
    <div class="caja">
      <p class="grande">Toca la pantalla para mirar alrededor</p>
      <p class="chica">Moverse: <b>W A S D</b> o las flechas · Correr: <b>Mayúsculas</b> · Salir del ratón: <b>Esc</b></p>
    </div>
  </div>
</div>

<!-- ===== CAPAS FLOTANTES ===== -->
<div id="celebracion" aria-hidden="true"></div>
<div id="transicion" aria-hidden="true"></div>
<div id="avisos" role="status" aria-live="polite"></div>

<audio id="pista-musica" loop preload="none"></audio>

<!-- ===== CÓDIGO ===== -->
<script src="vendor/three.min.js"></script>
<script src="contenido/historia.js"></script>
<script src="js/util.js"></script>
<script src="js/audio.js"></script>
<script src="js/escena.js"></script>
<script src="js/dialogo.js"></script>
<script src="js/acertijos.js"></script>
<script src="js/album.js"></script>
<script src="js/mundo/piezas.js"></script>
<script src="js/mundo/paisaje.js"></script>
<script src="js/mundo/jugador.js"></script>
<script src="js/mundo/mundo.js"></script>
<script src="js/motor.js"></script>
<script src="js/main.js"></script>
</body>
</html>
