}

#titulo{ margin:6px 0 0; font:2em Georgia,serif; }

#objetivo{

}

#objetivo p{ margin:6px 0; }

/* ---------------- mira y cartel ---------------- */
#mira{
  position:fixed; top:50%; left:50%; width:7px; height:7px; margin:-3.5px 0 0 -3.5px;
  border-radius:50%; background:#faf0dc88; pointer-events:none;

}
#mira.activa{ transform:scale(2.2); background:var(--oro); box-shadow:0 0 12px #e1b58099; }

#cartel{
  position:fixed; top:calc(50% + 40px); left:50%; transform:translateX(-50%);
  display:flex; flex-direction:column; align-items:center; gap:6px;
  background:#133641ed; border:1px solid #cbb69077; border-radius:20px;
  padding:12px 22px; text-align:center; max-width:min(90vw,380px); pointer-events:none;
}
#cartel-txt{ font:1.25em Georgia,serif; }
#cartel-acc{ font-size:.7em; letter-spacing:.18em; text-transform:uppercase; color:var(--oro); }
#cartel-acc b{ border:1px solid #cbb69099; border-radius:4px; padding:1px 6px; background:#e1b58022; }

#aviso{
  position:fixed; left:50%; transform:translateX(-50%); bottom:96px;
  width:min(660px,90vw); text-align:center; background:#17353ef2;
  border-radius:10px; padding:14px 22px; line-height:1.5; pointer-events:none;
}

}
#controles button{
  background:#163644cf; border:1px solid #b7c4b966; border-radius:22px; padding:9px 14px;
}
#controles b{ border:1px solid #b7c4b988; border-radius:4px; padding:0 5px; margin-left:5px; }
#guardado{ color:#9fb3b3; }

/* ---------------- paneles ---------------- */
#panel{
  position:fixed; inset:0; display:grid; place-items:center; padding:22px;
  background:#0b243873; backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); z-index:20;
}
#panel-caja{

  padding:34px 38px; line-height:1.6; box-shadow:0 24px 90px #0006;
}
#panel-caja h2{ margin:14px 0 20px; font:2.6em/1.12 Georgia,serif; letter-spacing:-.03em; }
#panel-caja h3{ margin:10px 0 18px; font:1.9em/1.2 Georgia,serif; }
.p-kicker{ margin:0; font-size:.68em; letter-spacing:.16em; text-transform:uppercase; color:var(--oro); }
.p-lede{ font:1.15em/1.75 Georgia,serif; color:#f3e7d3; }
.p-recuerdo{ white-space:pre-line; }
.p-small{ font-size:.8em; color:#bacbc9; }
.p-acciones{ display:flex; flex-wrap:wrap; gap:10px; margin-top:22px; }
.p-carta{ white-space:pre-line; font:1.4em/1.85 Georgia,serif; color:#f7e5c9; }
.p-firma{ font:1.3em Georgia,serif; font-style:italic; color:var(--oro); margin-top:26px; }

.ac-sub{ font:1.1em Georgia,serif; color:#f3e7d3; }
.ac-campo{

.ac-campo:focus{ outline:none; border-color:var(--oro); }
.ac-botones{ display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-top:16px; }
.ac-ok,.ac-suave{

.ac-ok{ background:#e1b580; color:#22303a; border-color:#e1b580; font-weight:600; }
.ac-ok:disabled{ opacity:.4; cursor:default; }
.ac-suave:hover,.ac-ok:not(:disabled):hover{ filter:brightness(1.08); }
.ac-cuenta{ font-size:.8em; color:#bacbc9; margin-right:auto; }

.ac-rejilla{ display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:9px; }
.ac-columna{ display:flex; flex-direction:column; gap:9px; }

.ac-opcion.elegida,.ac-fila.elegida{ border-color:var(--oro); background:#e1b58033; }
.ac-fila{ display:flex; align-items:center; gap:12px; }
.ac-num{
  flex:0 0 26px; width:26px; height:26px; display:grid; place-items:center;
  border:1px solid #b7c4b966; border-radius:50%; font-size:.8em;
}
.ac-fila.elegida .ac-num{ background:var(--oro); color:#22303a; border-color:var(--oro); }
.bien{ border-color:#8fcfa8 !important; background:#8fcfa826 !important; }
.mal{ border-color:#e08b85 !important; background:#e08b8522 !important; }
.ac-ancha{ text-align:center; }
.ac-campana{ text-align:center; border-left:5px solid var(--c,#888); }
.ac-campana.sonando{ background:#e1b58044; transform:scale(.97); }

.ac-barra i{ position:absolute; top:0; bottom:0; background:#e9d59d66; border-radius:4px; }

.ac-pistas{ margin-top:14px; }
.ac-pista{

@media (prefers-reduced-motion:reduce){

    this._pintarPuntos();
    this.mostrarAviso(a2.alAcertar || "Encuadre recuperado.");
    const quedan = a2.encuadres.filter((_2, i2) => !this.puntos.find((x2) => x2.id === "marca" + i2)?.hecho);
    if (!quedan.length) {
      const v2 = this.puntos.find((x2) => x2.clase === "volver");
      if (v2) {
        v2.visible = true;
        this._pintarPuntos();
        this.mostrarAviso("Vuelve a vuestro banco.");
      }
    }
    this._pintarHud();
  }
  /* ---------------- acertijos de panel ---------------- */
  abrirAcertijo(a2, punto) {
    let resuelto = false;
    const zonaPistas = el2("div", { clase: "ac-pistas" });
    const api = {
      resuelto: () => resuelto,
      acierto: () => {
        if (resuelto) return;
        resuelto = true;
        if (punto) punto.hecho = true;
        this.cerrarPanel(true);
        this.mostrarAviso(a2.alAcertar || "Bien.");
        if (a2.despues) {
          setTimeout(() => this.abrirAcertijo(a2.despues, null), 900);
        } else this.resuelto();
      },
      fallo: (txt) => {
        this.fallos++;
        this.mostrarAviso(txt || ["No es eso\u2026", "Casi", "Prueba otra vez"][Math.min(this.fallos - 1, 2)], 2200);
        if (this.fallos % 2 === 0) this.darPista(true, zonaPistas);
      }
    };
    this.abrirPanel(el2(
      "div",
      {},
      el2("p", { clase: "p-kicker" }, this.lugar.titulo),
      el2("h3", {}, a2.pregunta || this.lugar.objetivo),
      crearAcertijo(a2, api),
      zonaPistas,
      el2(
        "div",
        { clase: "ac-botones" },
        el2("button", { clase: "ac-suave", onclick: () => this.darPista(false, zonaPistas) }, "Una pista"),
        el2("button", { clase: "ac-suave", onclick: () => this.cerrarPanel() }, "Volver")
      )
    ));
    this._zonaPistas = zonaPistas;
  }
  darPista(auto, zona) {
    const p2 = this.lugar?.pistas || [];
    zona = zona || this._zonaPistas;
    if (this.pistasDadas >= p2.length) {
      if (!auto) this.mostrarAviso("Ya no me quedan m\xE1s pistas.");
      return;
    }
    const txt = p2[this.pistasDadas++];
    const nodo = el2("div", { clase: "ac-pista" }, `Ayuda ${this.pistasDadas} de ${p2.length} \xB7 ${txt}`);
    if (zona && this.panelAbierto) zona.appendChild(nodo);
    else this.mostrarAviso(`Ayuda ${this.pistasDadas} de ${p2.length} \xB7 ${txt}`, 7e3);
  }
  fallar(txt) {
    this.fallos++;
    this.mostrarAviso(txt, 2600);
  }
  /* ---------------- resolver un lugar ---------------- */
  resuelto() {
    const id2 = this.lugar.id;
    if (!this.estado.hechos.includes(id2)) {
      this.estado.hechos.push(id2);
      if (id2 !== "final") this.estado.cristales.push(id2);
      this.guardar();
    }
    const ultimo = this.estado.lugar >= LUGARES.length - 1;
    setTimeout(() => this.abrirPanel(el2(
      "div",
      {},
      el2("p", { clase: "p-kicker" }, "Recuerdo recuperado"),
      el2("h3", {}, this.lugar.titulo),
      el2("p", { clase: "p-lede p-recuerdo" }, this.lugar.recuerdo),
      el2(
        "div",
        { clase: "p-acciones" },
        el2(
          "button",
          { clase: "ac-ok", onclick: () => ultimo ? this.final() : this.irA(this.estado.lugar + 1) },
          ultimo ? "Abrir la carta" : "Seguir"
        )
      )
    ), { cerrable: false }), 700);
  }
  final() {
    this.enJuego = false;
    this.abrirPanel(el2(
      "div",
      { clase: "p-final" },
      el2("p", { clase: "p-kicker" }, FINAL.titulo),
      el2("p", { clase: "p-carta" }, FINAL.texto),
      el2("p", { clase: "p-firma" }, FINAL.firma),
      el2("p", { clase: "p-small" }, FINAL.fecha)
    ), { cerrable: false });
  }
  /* ---------------- paneles y avisos ---------------- */
  abrirPanel(nodo, o2 = {}) {
    this.panelAbierto = true;
    this.jugador?.bloquear(true);
    this.ui.panelCaja.replaceChildren(nodo);
    this.ui.panel.hidden = false;
    this.ui.panel.dataset.cerrable = o2.cerrable === false ? "no" : "si";
    this._verRaton();
  }
  /**
   * @param forzar  cierra aunque el panel esté marcado como no cerrable.
   *   Los paneles de portada, recuerdo y final no se cierran con Esc, pero el
   *   propio juego sí tiene que poder quitarlos al cambiar de pantalla.
   */
  cerrarPanel(forzar = false) {
    if (!forzar && this.ui.panel.dataset.cerrable === "no") return;
    this.panelAbierto = false;
    this.ui.panel.hidden = true;
    this.jugador?.bloquear(false);
    this._verRaton();
  }
  pausa() {
    const aj = this.estado.ajustes;

    const rango = (v2, min, max, step, alCambiar) => el2("input", {
      type: "range",
      min,
      max,
      step,
      value: v2,
      oninput: (e2) => {
        alCambiar(parseFloat(e2.target.value));
        this.guardar();
      }
    });
    this.abrirPanel(el2(
      "div",
      {},
      el2("h3", {}, "Pausa"),
      el2(
        "div",
        { clase: "aj" },
        fila("Sensibilidad", rango(aj.sensibilidad, 0.3, 2, 0.1, (v2) => {
          aj.sensibilidad = v2;
          this.jugador.sensibilidad = v2;
        })),
        fila("Velocidad al caminar", rango(aj.velocidad, 0.5, 1.6, 0.1, (v2) => {
          aj.velocidad = v2;
          this.jugador.velocidadAjuste = v2;
        })),
        fila("Tama\xF1o del texto", rango(aj.texto, 0.85, 1.4, 0.05, (v2) => {
          aj.texto = v2;
          document.documentElement.style.setProperty("--escala", v2);
        })),
        fila("Calidad gr\xE1fica", el2(
          "select",
          { onchange: (e2) => {
            aj.calidad = Number(e2.target.value);
            this.render.ponerCalidad(aj.calidad);
            this.guardar();
          } },
          el2("option", { value: 2, selected: aj.calidad === 2 }, "Alta"),
          el2("option", { value: 1, selected: aj.calidad === 1 }, "Media"),
          el2("option", { value: 0, selected: aj.calidad === 0 }, "Ligera")
        )),
        fila("Movimiento de c\xE1mara", el2("input", {
          type: "checkbox",
          checked: aj.balanceo,
          onchange: (e2) => {
            aj.balanceo = e2.target.checked;
            this.jugador.balanceo = aj.balanceo;
            this.guardar();
          }
        }))
      ),
      el2(
        "div",
        { clase: "p-acciones" },
        el2("button", { clase: "ac-ok", onclick: () => this.cerrarPanel() }, "Continuar"),
        el2("button", { clase: "ac-suave", onclick: () => {
          if (confirm("\xBFBorrar la partida? Se pierde lo que llevas.")) {

        } }, "Borrar partida")
      )
    ));
  }
  mostrarAviso(txt, ms2 = 4e3) {
    this.ui.aviso.textContent = txt;
    this.ui.aviso.hidden = false;
    clearTimeout(this._tAviso);
    this._tAviso = setTimeout(() => {
      this.ui.aviso.hidden = true;
    }, ms2);
  }
  _pintarHud() {
    const L2 = this.lugar;
    this.ui.titulo.textContent = L2.titulo;
    this.ui.subtitulo.textContent = L2.subtitulo;
    this.ui.objetivoTxt.textContent = L2.objetivo;
    this.ui.progreso.textContent = `${this.estado.cristales.length} de ${LUGARES.length - 1} cristales` + (this.mochila.length ? ` \xB7 ${this.mochila.length} en la mochila` : "");
    this.ui.cabecera.hidden = false;
    this.ui.objetivo.hidden = false;
  }
};
export {
  Juego
};

window.__juego = j;
</script>
